# Sistema de Gestión de Planta Docente
# Iniciar:   docker compose up -d --build
# Detener:   docker compose down
# Reiniciar: docker compose restart
# Logs:      docker compose logs -f api
# Demo online (opcional): docker compose --profile demo up -d  →  docker compose logs tunel
#   + n8n online:          docker compose --profile demo --profile demo-n8n up -d  →  docker compose logs tunel-n8n

services:
  api:
    build: ./api
    container_name: pd-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./api/app:/app/app      # hot reload en desarrollo
      - ./data:/app/data        # base SQLite persistente
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para llegar a Ollama en el host
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pd-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      # En Windows, Docker no le avisa al contenedor cuando cambia un archivo de la carpeta montada.
      # "poll" hace que Streamlit revise los archivos cada tanto y recargue solo los cambios.
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    restart: unless-stopped

  n8n:
    # Versión fija: con "latest" cada instalación puede bajar una versión distinta
    # (n8n 2.0 cambió, por ejemplo, el interruptor "Active" por el botón "Publish").
    image: n8nio/n8n:2.46.6
    container_name: pd-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_SECURE_COOKIE=false
      # Hay un proxy delante cuando se usa el túnel (tunel-n8n). Con esto n8n lee bien la
      # dirección y el protocolo originales; en uso local no cambia nada.
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows   # workflows exportados (JSON) versionados en Git
    restart: unless-stopped

  # Túnel de Cloudflare para mostrar la interfaz en internet durante la demo.
  # - Solo se levanta con el perfil "demo": el "docker compose up -d" de siempre NO lo prende.
  # - Publica SOLO el frontend: la API, n8n y Ollama siguen siendo accesibles únicamente desde
  #   esta computadora (Streamlit habla con la API por la red interna de Docker).
  # - La dirección (https://....trycloudflare.com) es al azar, cambia en cada reinicio
  #   y aparece en "docker compose logs tunel". No necesita cuenta ni dominio.
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: pd-tunel
    command: tunnel --no-autoupdate --url http://frontend:8501
    depends_on:
      - frontend
    profiles: ["demo"]
    restart: on-failure   # se reintenta si falla, pero no se vuelve a prender solo al reiniciar Docker

  # Túnel de Cloudflare para usar el editor de n8n desde otro dispositivo durante la demo.
  # - Perfil propio ("demo-n8n"): se prende aparte del túnel del frontend.
  # - El editor pide el usuario y la contraseña de n8n, pero los webhooks quedan públicos
  #   (por ejemplo /webhook/cv): prenderlo solo mientras haga falta.
  # - La dirección es al azar y aparece en "docker compose logs tunel-n8n".
  tunel-n8n:
    image: cloudflare/cloudflared:2026.10.7
    container_name: pd-tunel-n8n
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n
    profiles: ["demo-n8n"]
    restart: on-failure

volumes:
  n8n_data:
